name: Sync Upstream Updates

on:
  schedule:
    - cron: "0 0 * * 6"  # Automatically syncs every Saturday at midnight UTC
  workflow_dispatch:   # Allows you to click a button to force-sync manually

jobs:
  sync:
    name: Sync Master Repo
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Your Private Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git Identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@://github.com"

      - name: Add Upstream and Merge
        run: |
          git remote add upstream https://github.com
          git fetch upstream main
          # Force git to merge changes, favoring your custom configurations if a direct conflict ever happens
          git merge upstream/main -m "Automated upstream sync" --allow-unrelated-histories || true
          # Resolve minor whitespace conflicts automatically if any occur in files we don't care about
          git checkout --ours devices/xiaomi_ax3600/config .github/workflows/build.yml
          git add .
          git commit -m "Resolve sync conflicts for custom configurations" || echo "No conflicts to resolve"
          git push origin main
